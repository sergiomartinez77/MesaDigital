services:
  - type: web
    name: mesa-digital
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mesa-digital-db
          property: connectionString
databases:
  - name: mesa-digital-db
    plan: free
